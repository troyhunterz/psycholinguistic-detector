name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10"

            - name: Install dependencies
              run: |
                  pip install -r requirements.txt
                  pip install pytest==9.0.2 ruff==0.16.2 "spacy==3.8.11"
                  python -m spacy download en_core_web_sm

            - name: Lint with ruff
              run: ruff check .

            - name: Run tests
              run: pytest tests/ -v --tb=short
