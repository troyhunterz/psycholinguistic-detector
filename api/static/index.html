<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manipulation Detector</title>
    <style>
        :root {
            --bg: #1a1a1a;
            --card: #242424;
            --accent: #d97757;
            --text: #e8e8e8;
            --muted: #9a9a9a;
            --line: #333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, Segoe UI, sans-serif;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .wrap {
            max-width: 640px;
            margin: 0 auto;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 6px;
        }

        .sub {
            color: var(--muted);
            font-size: 14px;
            text-align: center;
            margin-bottom: 28px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 16px;
        }

        textarea {
            width: 100%;
            height: 140px;
            resize: vertical;
            background: #1c1c1c;
            color: var(--text);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 14px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
        }

        textarea:focus {
            border-color: var(--accent);
        }

        .btns {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
        }

        button:hover {
            opacity: .9;
        }

        .hidden {
            display: none;
        }

        .chip {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 999px;
            background: var(--accent);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            text-transform: capitalize;
        }

        .conf {
            color: var(--muted);
            font-size: 14px;
            margin-top: 8px;
        }

        .conf b {
            color: var(--text);
        }

        .bar-row {
            display: grid;
            grid-template-columns: 150px 1fr 46px;
            align-items: center;
            gap: 10px;
            margin: 8px 0;
            font-size: 13px;
        }

        .bar-name {
            color: var(--muted);
            text-align: right;
            text-transform: capitalize;
        }

        .bar-track {
            height: 8px;
            border-radius: 999px;
            background: #1c1c1c;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            border-radius: 999px;
            transition: width .2s ease;
        }

        .bar-pct {
            color: var(--muted);
            text-align: right;
        }

        .explain-title {
            color: var(--accent);
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .explain-body {
            color: var(--text);
            font-size: 15px;
            line-height: 1.7;
            white-space: pre-line;
        }

        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid var(--line);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin .8s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading {
            text-align: center;
            padding: 24px;
        }

        .loading p {
            color: var(--muted);
            margin-top: 12px;
        }

        .error {
            background: #3a1a1a;
            border: 1px solid #7a2a2a;
            color: #f0a0a0;
            border-radius: 12px;
            padding: 14px;
            font-size: 14px;
            margin-bottom: 16px;
        }

        .foot {
            margin-top: 24px;
            text-align: center;
            font-size: 12px;
            color: var(--muted);
        }

        .foot a {
            color: var(--accent);
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <h1>🧠 Manipulation Detector</h1>
        <p class="sub">Detects psycholinguistic manipulation techniques in text</p>

        <div class="card">
            <textarea id="inputText"
                placeholder="Paste any text here — political speech, news article, social media post..."></textarea>
            <div class="btns">
                <button class="btn-primary" onclick="analyze(false)">Quick Classify</button>
                <button class="btn-secondary" onclick="analyze(true)">Deep Analysis (AI)</button>
            </div>
        </div>

        <div id="error" class="error hidden"></div>

        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>Analyzing...</p>
        </div>

        <div id="result" class="hidden">
            <div class="card">
                <span id="labelBadge" class="chip"></span>
                <div class="conf">Confidence: <b id="confidence"></b></div>
                <div id="scores" style="margin-top:16px;"></div>
            </div>
            <div id="explanationBlock" class="card hidden">
                <div class="explain-title">AI Explanation</div>
                <p id="explanation" class="explain-body"></p>
            </div>
        </div>

        <p class="foot">DistilBERT (ONNX) + Groq · <a href="/docs">API docs</a> · <a
                href="https://github.com/troyhunterz/psycholinguistic-detector">GitHub</a></p>
    </div>

    <script>
        const LABELS = {
            fear_appeal: "Fear Appeal",
            emotional_manipulation: "Emotional Manipulation",
            demagogy_tricks: "Demagogy",
            authority_appeal: "Authority Appeal",
            rational_argument: "Rational Argument",
        };

        async function analyze(deep) {
            const text = document.getElementById("inputText").value.trim();
            if (!text) { showError("Please enter some text first."); return; }
            showLoading(true); hideResult(); hideError();
            try {
                const endpoint = deep ? "/analyze" : "/predict";
                const res = await fetch(endpoint, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ text }),
                });
                if (!res.ok) throw new Error(`Server error: ${res.status}`);
                const data = await res.json();
                showResult(data, deep);
            } catch (err) {
                showError(err.message);
            } finally {
                showLoading(false);
            }
        }

        function showResult(data, deep) {
            document.getElementById("labelBadge").textContent = LABELS[data.label] || data.label;
            document.getElementById("confidence").textContent = (data.confidence * 100).toFixed(1) + "%";

            const sorted = Object.entries(data.all_scores).sort((a, b) => b[1] - a[1]);
            document.getElementById("scores").innerHTML = sorted.map(([name, score], i) => {
                const pct = (score * 100).toFixed(1);
                const color = i === 0 ? "var(--accent)" : "var(--muted)";
                return `<div class="bar-row">
        <span class="bar-name">${LABELS[name] || name}</span>
        <span class="bar-track"><span class="bar-fill" style="width:${pct}%;background:${color}"></span></span>
        <span class="bar-pct">${pct}%</span>
      </div>`;
            }).join("");

            const block = document.getElementById("explanationBlock");
            if (deep && data.explanation) {
                document.getElementById("explanation").textContent = data.explanation;
                block.classList.remove("hidden");
            } else {
                block.classList.add("hidden");
            }
            document.getElementById("result").classList.remove("hidden");
        }

        function showLoading(s) { document.getElementById("loading").classList.toggle("hidden", !s); }
        function hideResult() { document.getElementById("result").classList.add("hidden"); }
        function showError(m) { const e = document.getElementById("error"); e.textContent = m; e.classList.remove("hidden"); }
        function hideError() { document.getElementById("error").classList.add("hidden"); }
    </script>
</body>

</html>
